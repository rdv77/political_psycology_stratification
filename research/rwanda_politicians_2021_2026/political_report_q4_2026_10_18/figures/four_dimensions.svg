  <g id="text_1">
   <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #173446" x="33.264" y="28.116" transform="rotate(-0 33.264 28.116)">Четыре различия в публичной политике</text>
  </g>
  <g id="text_2">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4f6270" x="33.264" y="53.1648" transform="rotate(-0 33.264 53.1648)">Что выражает каждая ось и какие признаки в ней соединяются</text>
  </g>
  <g id="text_3">
   <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #167d9a" x="50.3712" y="130.8672" transform="rotate(-0 50.3712 130.8672)">1. Договариваться и вовлекать</text>
  </g>
  <g id="text_4">
   <text style="font-size: 11.8px; font-family: 'DejaVu Sans'; fill: #203743" transform="translate(50.3712 182.774156)">• Переговоры и посредничество</text>
   <text style="font-size: 11.8px; font-family: 'DejaVu Sans'; fill: #203743" transform="translate(50.3712 199.437231)">• Обсуждение и общественный контроль</text>
   <text style="font-size: 11.8px; font-family: 'DejaVu Sans'; fill: #203743" transform="translate(50.3712 216.100306)">• Национальная общность; услуги</text>
  </g>
  <g id="text_5">
   <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #566772" transform="translate(50.3712 244.865306)">Другой акцент: адресная помощь,</text>
   <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #566772" transform="translate(50.3712 256.958944)">финансовые инструменты, технологии.</text>
  </g>
  <g id="text_6">
   <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a55a32" x="516.0672" y="130.8672" transform="rotate(-0 516.0672 130.8672)">2. Развиваться своими силами</text>
  </g>
  <g id="text_7">
   <text style="font-size: 11.8px; font-family: 'DejaVu Sans'; fill: #203743" transform="translate(516.0672 182.774156)">• Внутренние возможности страны</text>
   <text style="font-size: 11.8px; font-family: 'DejaVu Sans'; fill: #203743" transform="translate(516.0672 199.12573)">• Инвестиции и деловая активность</text>
   <text style="font-size: 11.8px; font-family: 'DejaVu Sans'; fill: #203743" transform="translate(516.0672 215.788805)">• Общие международные обязательства</text>
  </g>
  <g id="text_8">
   <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #566772" transform="translate(516.0672 244.865306)">Другой акцент: внешние ресурсы,</text>
   <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #566772" transform="translate(516.0672 256.958944)">преемственность и защита своей позиции.</text>
  </g>
  <g id="text_9">
   <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8056a5" x="50.3712" y="332.7912" transform="rotate(-0 50.3712 332.7912)">3. Объяснять через ценности</text>
  </g>
  <g id="text_10">
   <text style="font-size: 11.8px; font-family: 'DejaVu Sans'; fill: #203743" transform="translate(50.3712 384.698156)">• Ценности, память, общие символы</text>
   <text style="font-size: 11.8px; font-family: 'DejaVu Sans'; fill: #203743" transform="translate(50.3712 401.361231)">• Смысл и основания политического выбора</text>
   <text style="font-size: 11.8px; font-family: 'DejaVu Sans'; fill: #203743" transform="translate(50.3712 417.712805)">• Такой язык доступен власти и критикам</text>
  </g>
  <g id="text_11">
   <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #566772" transform="translate(50.3712 446.770913)">Другой акцент: услуги, базовые блага,</text>
   <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #566772" transform="translate(50.3712 459.085275)">равноправное включение и общность.</text>
  </g>
  <g id="text_12">
   <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #44845a" x="516.0672" y="332.7912" transform="rotate(-0 516.0672 332.7912)">4. Обосновывать продолжение курса</text>
  </g>
  <g id="text_13">
   <text style="font-size: 11.8px; font-family: 'DejaVu Sans'; fill: #203743" transform="translate(516.0672 384.899125)">• Публичная поддержка курса</text>
   <text style="font-size: 11.8px; font-family: 'DejaVu Sans'; fill: #203743" transform="translate(516.0672 401.250698)">• Передача национальных ценностей</text>
   <text style="font-size: 11.8px; font-family: 'DejaVu Sans'; fill: #203743" transform="translate(516.0672 417.913773)">• Сохранение национальной общности</text>
  </g>
  <g id="text_14">
   <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #566772" transform="translate(516.0672 446.789306)">Другой акцент: международные проекты,</text>
   <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #566772" transform="translate(516.0672 458.882944)">внешние средства и предупреждение рисков.</text>
  </g>
  <g id="text_15">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #566772" x="33.264" y="504.5544" transform="rotate(-0 33.264 504.5544)">Это сочетания тем. Противоположная сторона оси не означает отрицание ценностей, услуг или сотрудничества.</text>
  </g>
 </g>

providers:
  perplexity:
    api_key: ${PPLX_API_KEY}
    model: sonar-pro
  openai:
    api_key: ${OPENAI_API_KEY}
    model_scoring: gpt-4.1
    model_dedupe: gpt-4.1
    model_describe: gpt-4.1
    model_search: gpt-4.1
# gpt-5-search-api
#o4-mini-deep-research

limits:
  max_countries: 20
  max_parties_per_country: 3
  max_traits: 200
  max_tokens_per_call: 5000
  max_cost_usd: 20
  max_concurrent_requests: 8

features:
  collect_countries: true
  collect_parties: true
  allow_user_input_objects: true
  extract_traits: true
  dedupe_traits: true
  scoring: true
  factor_analysis: true
  describe_factors: true
  cluster: true
  tsne: true
  reports: true

logging:
  mode: dev            # dev | prod | quiet
  console_enabled: true
  console_level: DEBUG # DEBUG в dev, OFF в prod/quiet
  file_enabled: true
  file_level: INFO     # CRITICAL в prod/quiet
  file_path: logs/app.log
  format: text         # text | json
  rotate_max_bytes: 10485760
  rotate_backup_count: 5
  include_llm_metrics: true  # токены, стоимость, кэш‑хиты

governance:
  require_user_approval: true  # без подтверждения не выполнять разрушающие/дорогие шаги
  confirm_flag_name: apply     # флаг CLI для снятия блокировки

analysis:
  factor:
    min_last_factor_variance: 0.03
    rotation: varimax  # varimax | oblimin | none
    max_factors: 25
  cluster:
    method: kmeans
    k_selection: silhouette  # fixed | elbow | gap | silhouette
    k_range: [7, 12]
    n_clusters: null        # Опционально: зафиксировать число кластеров; если >0, имеет приоритет
  tsne:
    perplexity: 30
    learning_rate: 'auto'
    random_state: 42

scoring:
  max_traits_per_call: 5

io:
  cache_dir: cache
  data_dir: data
  reports_dir: reports
  plots_dir: plots

locale:
  canonical_language: ru

user_input:
  enable_input_objects: true
  parties: {"Коммунистическая партия Российской Федерации": "Россия", "Единая Россия": "Россия", "Справедливая Россия": "Россия", "Российская партия пенсионеров": "Россия", "Либерально-демократическая партия России": "Россия", "Новые люди (российская политическая партия)": "Россия", "Родина (российская политическая партия)": "Россия", "Российская экологическая партия «Зеленые»": "Россия", "Яблоко (российская политическая партия)": "Россия"}

collect:
  provider: openai_search           # perplexity | openai_search
  fallback_provider: perplexity

prompts:
  objects: prompts/01_objects.md
  parties: prompts/02_parties.md
  traits: prompts/04_traits.md
  dedupe: prompts/05_dedupe.md
  scoring: prompts/06_scoring.md
  factor_describe: prompts/09_factor_describe.md
  cluster_describe: prompts/10_cluster_describe.md
  cluster_thematic: prompts/13_cluster_thematic.md

dedupe:
  similarity_threshold: 0.85  # по умолчанию 0.7; поднимайте до 0.85–0.9, чтобы убирать только почти идентичные

resilience:
  request_timeout_s: 60
  max_retries: 3
  backoff_base_s: 2
  cache_enabled: true

ethics:
  persist_raw_llm_outputs: true
  redact_pii: true


